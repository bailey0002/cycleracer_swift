name: SpeederProto
options:
  bundleIdPrefix: com.markbailey.speeder
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "18.0"
    macOS: "15.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    GENERATE_INFOPLIST_FILE: YES
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    MTL_FAST_MATH: YES
targets:
  SpeederProto-macOS:
    type: application
    platform: macOS
    sources:
      - Sources
      - path: Resources
        buildPhase: resources
    info:
      path: Info-macOS.plist
      properties:
        NSHumanReadableCopyright: "Speeder prototype (model: Cyberpunk Speeder by Piotr Pisiak, CC-BY-4.0)"
        LSApplicationCategoryType: public.app-category.games
        NSHighResolutionCapable: true
    settings:
      base:
        PRODUCT_NAME: SpeederProto
        PRODUCT_BUNDLE_IDENTIFIER: com.markbailey.speeder.mac
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: NO
        ENABLE_APP_SANDBOX: NO
  SpeederProto-iOS:
    type: application
    platform: iOS
    sources:
      - Sources
      - path: Resources
        buildPhase: resources
    info:
      path: Info-iOS.plist
      properties:
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UIStatusBarHidden: true
        UIViewControllerBasedStatusBarAppearance: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        # recorded clips land in Documents; these make it visible in Files and in Finder
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
    settings:
      base:
        PRODUCT_NAME: SpeederProto
        PRODUCT_BUNDLE_IDENTIFIER: com.markbailey.speeder.ios
        TARGETED_DEVICE_FAMILY: "1,2"
        DEVELOPMENT_TEAM: HNBN55RN29
        INFOPLIST_KEY_UIStatusBarHidden: YES
