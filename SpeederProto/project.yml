name: SpeederProto
options:
  bundleIdPrefix: com.markbailey.speeder
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "18.0"
    macOS: "15.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    GENERATE_INFOPLIST_FILE: YES
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    MTL_FAST_MATH: YES
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  SpeederProto-macOS:
    type: application
    platform: macOS
    sources:
      - Sources
      - path: Resources
        buildPhase: resources
    info:
      path: Info-macOS.plist
      properties:
        CFBundleDisplayName: "Kerb: Galactic"
        NSHumanReadableCopyright: "Kerb: Galactic prototype (model: Cyberpunk Speeder by Piotr Pisiak, CC-BY-4.0)"
        LSApplicationCategoryType: public.app-category.games
        NSHighResolutionCapable: true
    settings:
      base:
        PRODUCT_NAME: SpeederProto
        PRODUCT_BUNDLE_IDENTIFIER: com.markbailey.speeder.mac
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: NO
        ENABLE_APP_SANDBOX: NO
  SpeederProto-iOS:
    type: application
    platform: iOS
    sources:
      - Sources
      - path: Resources
        buildPhase: resources
    info:
      path: Info-iOS.plist
      properties:
        CFBundleDisplayName: "Kerb: Galactic"
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: LaunchLogo
          UIImageRespectsSafeAreaInsets: false
        UIRequiresFullScreen: true
        UIStatusBarHidden: true
        UIViewControllerBasedStatusBarAppearance: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    settings:
      base:
        PRODUCT_NAME: SpeederProto
        PRODUCT_BUNDLE_IDENTIFIER: com.markbailey.speeder.ios
        TARGETED_DEVICE_FAMILY: "1,2"
        DEVELOPMENT_TEAM: HNBN55RN29
        INFOPLIST_KEY_UIStatusBarHidden: YES
  SpeederProtoTests:
    # Headless 60 Hz loops over the pure game logic (MissionRunner, LightCycle, TrailSystem), hosted
    # by the Mac app: `xcodebuild test -scheme SpeederProto-macOS ...` (see README, "Tests").
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests
    dependencies:
      - target: SpeederProto-macOS
    settings:
      base:
        CODE_SIGN_IDENTITY: "-"
        PRODUCT_BUNDLE_IDENTIFIER: com.markbailey.speeder.tests
        # the app's product is SpeederProto, not the target name
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/SpeederProto.app/Contents/MacOS/SpeederProto"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  SpeederProto-macOS:
    build:
      targets:
        SpeederProto-macOS: all
        SpeederProtoTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - SpeederProtoTests
      environmentVariables:
        SPEEDER_SOUND: "0"
        SPEEDER_TITLE: "0"
        SPEEDER_TESTS: "1"
  SpeederProto-iOS:
    build:
      targets:
        SpeederProto-iOS: all
    run:
      config: Debug
